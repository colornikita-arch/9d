<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Графики линейных функций</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="reveal.js/dist/theme/night.css" id="theme">

    <style>
        .coordinate-plane {
            width: 600px;
            height: 480px;
            background-image:
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            position: relative;
            margin: 0 auto;
            overflow: hidden !important;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .axis {
            position: absolute;
            background: #fff;
            box-shadow: 0 0 3px rgba(255,255,255,0.5);
        }
        .x-axis {
            width: 100%;
            height: 1px;
            top: 240px;
            left: 0;
        }
        .x-axis::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -4px;
            width: 0;
            height: 0;
            border-left: 6px solid #fff;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }
        .y-axis {
            width: 1px;
            height: 100%;
            left: 300px;
            top: 0;
        }
        .y-axis::after {
            content: '';
            position: absolute;
            left: -4px;
            top: -5px;
            width: 0;
            height: 0;
            border-bottom: 6px solid #fff;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
        }
        .axis-label {
            position: absolute;
            color: #fff;
            font-size: 16px;
        }
        .x-label {
            right: 10px;
            top: 250px;
        }
        .y-label {
            left: 285px;
            top: 0px;
        }
        .tick {
            position: absolute;
            background: #fff;
        }
        .x-tick {
            width: 1px;
            height: 8px;
            transform: translateX(-50%);
            top: 236px;
        }
        .y-tick {
            width: 8px;
            height: 1px;
            transform: translateY(-50%);
            left: 297px;
        }
        .point-label {
            position: absolute;
            color: #fff;
            font-size: 14px;
            transform: translate(-50%, -50%);
        }

        /* Стили для графиков */
        .graph-point {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #44aaff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            opacity: 0;
        }

        /* Прозрачные точки */
        .graph-point.transparent {
            opacity: 0 !important;
            background: transparent !important;
        }

        .graph-line {
            position: absolute;
            height: 3px;
            background: #44aaff;
            transform-origin: left center;
            z-index: 5;
            opacity: 0;
        }

        .graph-line.animating {
            opacity: 1;
            transition: width 0.1s ease-out;
        }

        .graph-line.completed {
            opacity: 1;
            transition: none;
        }

        /* Подписи графиков */
        .graph-label {
            position: absolute;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 20;
            opacity: 0;
        }

        .graph-visible {
            opacity: 1 !important;
        }

        .graph-point.animating {
            transition: opacity 0.15s ease;
        }

        .two-column-slide {
            display: flex;
            height: 85vh;
            padding: 0 20px;
            gap: 40px;
            align-items: flex-start;
            margin-top: 80px;
        }
        .left-column {
            flex: 25%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .right-column {
            flex: 75%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-top: 20px;
            overflow: visible !important;
        }
        .function-display {
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .function-formula {
            font-size: 16px;
            margin: 0;
        }
        .points-table-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .table-title {
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
            color: #fff;
        }
        .points-table {
            border-collapse: collapse;
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .points-table th {
            background: rgba(255,255,255,0.2);
            padding: 8px 10px;
            font-weight: bold;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        .points-table td {
            padding: 6px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .points-table tr:last-child td {
            border-bottom: none;
        }
        .points-table tr {
            transition: background-color 0.3s ease;
        }
        .points-table tr:hover {
            background: rgba(255,255,255,0.05);
        }


        .reveal .slides section {
            overflow: visible !important;
        }

        .reveal .slides > section,
        .reveal .slides > section > section {
            padding: 0 !important;
            height: auto !important;
            min-height: 100vh;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .graph-color-1 { background: #44aaff; }
        .graph-color-2 { background: #ff4444; }
        .graph-color-3 { background: #44ff44; }
        .graph-color-4 { background: #ffaa44; }
        .graph-color-5 { background: #aa44ff; }
        .graph-color-6 { background: #ff44aa; }
        .graph-color-7 { background: #44ffaa; }
        .graph-color-8 { background: #aaff44; }
        .graph-color-9 { background: #aa44aa; }

        .graph-color-1-very-light { background: #44aaff22; }
        .graph-color-2-very-light { background: #ff444422; }
        .graph-color-3-very-light { background: #44ff4422; }
        .graph-color-4-very-light { background: #ffaa4422; }
        .graph-color-5-very-light { background: #aa44ff22; }
        .graph-color-6-very-light { background: #ff44aa22; }
        .graph-color-7-very-light { background: #44ffaa22; }
        .graph-color-8-very-light { background: #aaff4422; }
        .graph-color-9-very-light { background: #aa44aa22; }

        .graph-color-1-light { background: #44aaff55; }
        .graph-color-2-light { background: #ff444455; }
        .graph-color-3-light { background: #44ff4455; }
        .graph-color-4-light { background: #ffaa4455; }
        .graph-color-5-light { background: #aa44ff55; }
        .graph-color-6-light { background: #ff44aa55; }
        .graph-color-7-light { background: #44ffaa55; }
        .graph-color-8-light { background: #aaff4455; }
        .graph-color-9-light { background: #aa44aa55; }

        .graph-color-1-medium { background: #44aaff88; }
        .graph-color-2-medium { background: #ff444488; }
        .graph-color-3-medium { background: #44ff4488; }
        .graph-color-4-medium { background: #ffaa4488; }
        .graph-color-5-medium { background: #aa44ff88; }
        .graph-color-6-medium { background: #ff44aa88; }
        .graph-color-7-medium { background: #44ffaa88; }
        .graph-color-8-medium { background: #aaff4488; }
        .graph-color-9-medium { background: #aa44aa88; }


        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: background 0.3s ease;
        }

        .progress-dot.active {
            background: #44aaff;
            transform: scale(1.2);
        }

    </style>
</head>

<body>
    <div class="reveal">
        <div class="slides">

        </div>
    </div>

    <script src="reveal.js/dist/reveal.js"></script>
    <script src="reveal.js/plugin/math/math.js"></script>
    <script>
        let currentAnimationStates = new Map();

        function createCoordinatePlane(containerId, points = [], lines = [], additionalGraphs = []) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const plane = document.createElement('div');
            plane.className = 'coordinate-plane';

            const scale = 30;
            const centerY = 240;
            const centerX = 300;

            plane.innerHTML = `
                <div class="axis x-axis"></div>
                <div class="axis y-axis"></div>
                <div class="axis-label x-label">x</div>
                <div class="axis-label y-label">y</div>

                <!-- Черточки на оси X -->
                <div class="tick x-tick" style="left: ${centerX + (-7) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (-5) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (-3) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (-1) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (1) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (3) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (5) * scale}px;"></div>
                <div class="tick x-tick" style="left: ${centerX + (7) * scale}px;"></div>

                <!-- Черточки на оси Y -->
                <div class="tick y-tick" style="top: ${centerY - (7) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (5) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (3) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (1) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (-1) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (-3) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (-5) * scale}px;"></div>
                <div class="tick y-tick" style="top: ${centerY - (-7) * scale}px;"></div>

                <!-- Подписи на оси X -->
                <div class="point-label" style="left: ${centerX + (-7) * scale}px; top: ${centerY + 15}px;">-7</div>
                <div class="point-label" style="left: ${centerX + (-5) * scale}px; top: ${centerY + 15}px;">-5</div>
                <div class="point-label" style="left: ${centerX + (-3) * scale}px; top: ${centerY + 15}px;">-3</div>
                <div class="point-label" style="left: ${centerX + (-1) * scale}px; top: ${centerY + 15}px;">-1</div>
                <div class="point-label" style="left: ${307 + (0) * scale}px; top: ${centerY + 15}px;">0</div>
                <div class="point-label" style="left: ${centerX + (1) * scale}px; top: ${centerY + 15}px;">1</div>
                <div class="point-label" style="left: ${centerX + (3) * scale}px; top: ${centerY + 15}px;">3</div>
                <div class="point-label" style="left: ${centerX + (5) * scale}px; top: ${centerY + 15}px;">5</div>
                <div class="point-label" style="left: ${centerX + (7) * scale}px; top: ${centerY + 15}px;">7</div>

                <!-- Подписи на оси Y -->
                <div class="point-label" style="left: 285px; top: ${centerY - (7) * scale}px;">7</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (5) * scale}px;">5</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (3) * scale}px;">3</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (1) * scale}px;">1</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (-1) * scale}px;">-1</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (-3) * scale}px;">-3</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (-5) * scale}px;">-5</div>
                <div class="point-label" style="left: 285px; top: ${centerY - (-7) * scale}px;">-7</div>
            `;

            const totalSteps = additionalGraphs.length + 1;
            currentAnimationStates.set(containerId, {
                currentStep: 0,
                totalSteps: totalSteps,
                pointsAnimated: new Set(),
                linesAnimated: new Set()
            });


            additionalGraphs.forEach((graph, index) => {

                graph.points.forEach(point => {
                    const pointEl = document.createElement('div');
                    pointEl.className = `graph-point ${point.colorClass}`;
                    if (point.transparent) {
                        pointEl.classList.add('transparent');
                    }
                    pointEl.style.left = `${centerX + point.x * scale}px`;
                    pointEl.style.top = `${centerY - point.y * scale}px`;
                    pointEl.dataset.step = graph.step;
                    pointEl.dataset.pointId = `${graph.step}-${point.x}-${point.y}`;
                    plane.appendChild(pointEl);
                });

                graph.lines.forEach(line => {
                    const lineEl = document.createElement('div');
                    lineEl.className = 'graph-line';
                    lineEl.style.left = `${centerX + line.x1 * scale}px`;
                    lineEl.style.top = `${centerY - line.y1 * scale}px`;

                    const dx = (line.x2 - line.x1) * scale;
                    const dy = (line.y2 - line.y1) * scale;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(-dy, dx) * 180 / Math.PI;

                    lineEl.style.width = `0px`;
                    lineEl.style.transform = `rotate(${angle}deg)`;
                    lineEl.className = `graph-line ${line.colorClass}`;
                    lineEl.dataset.step = graph.step;
                    lineEl.dataset.fullLength = length;
                    lineEl.dataset.lineId = `${graph.step}-${line.x1}-${line.y1}-${line.x2}-${line.y2}`;
                    plane.appendChild(lineEl);
                });


                if (graph.label) {
                    const labelEl = document.createElement('div');
                    labelEl.className = 'graph-label';
                    labelEl.textContent = graph.label;

                    let maxY = -Infinity;
                    let maxX = 0;
                    graph.points.forEach(point => {
                        if (point.y > maxY) {
                            maxY = point.y;
                            maxX = point.x;
                        }
                    });

                    // Размещаем подпись немного выше и правее верхней вершины
                    const labelX = centerX + (maxX + 0.5) * scale;
                    const labelY = centerY - (maxY + 0.3) * scale;
                    labelEl.style.left = `${labelX}px`;
                    labelEl.style.top = `${labelY}px`;
                    labelEl.dataset.step = graph.step;
                    plane.appendChild(labelEl);
                }
            });

            const mainGraphStep = additionalGraphs.length + 1;
            points.forEach(point => {
                const pointEl = document.createElement('div');
                pointEl.className = `graph-point ${point.colorClass || 'graph-color-1'}`;
                if (point.transparent) {
                    pointEl.classList.add('transparent');
                }
                pointEl.style.left = `${centerX + point.x * scale}px`;
                pointEl.style.top = `${centerY - point.y * scale}px`;
                pointEl.dataset.step = mainGraphStep;
                pointEl.dataset.pointId = `${mainGraphStep}-${point.x}-${point.y}`;
                plane.appendChild(pointEl);
            });

            lines.forEach(line => {
                const lineEl = document.createElement('div');
                lineEl.className = 'graph-line';
                lineEl.style.left = `${centerX + line.x1 * scale}px`;
                lineEl.style.top = `${centerY - line.y1 * scale}px`;

                const dx = (line.x2 - line.x1) * scale;
                const dy = (line.y2 - line.y1) * scale;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(-dy, dx) * 180 / Math.PI;

                lineEl.style.width = `0px`;
                lineEl.style.transform = `rotate(${angle}deg)`;
                lineEl.className = `graph-line ${line.colorClass || 'graph-color-1'}`;
                lineEl.dataset.step = mainGraphStep;
                lineEl.dataset.fullLength = length;
                lineEl.dataset.lineId = `${mainGraphStep}-${line.x1}-${line.y1}-${line.x2}-${line.y2}`;
                plane.appendChild(lineEl);
            });

            container.appendChild(plane);
        }


        function animateLine(lineElement) {
            return new Promise((resolve) => {
                const fullLength = parseFloat(lineElement.dataset.fullLength);

                lineElement.classList.add('animating');
                lineElement.style.width = `${fullLength}px`;

                setTimeout(() => {
                    lineElement.classList.remove('animating');
                    lineElement.classList.add('completed');
                    resolve();
                }, 100);
            });
        }

        function animatePoint(pointElement) {
            return new Promise((resolve) => {
                pointElement.classList.add('animating');
                pointElement.classList.add('graph-visible');

                setTimeout(() => {
                    pointElement.classList.remove('animating');
                    resolve();
                }, 150);
            });
        }

        async function showAnimationStep(containerId, step) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const animationState = currentAnimationStates.get(containerId);
            if (!animationState) return;

            const stepPoints = container.querySelectorAll(`.graph-point[data-step="${step}"]`);
            const stepLabels = container.querySelectorAll(`.graph-label[data-step="${step}"]`);

            for (const point of stepPoints) {
                const pointId = point.dataset.pointId;
                if (!animationState.pointsAnimated.has(pointId)) {
                    await animatePoint(point);
                    animationState.pointsAnimated.add(pointId);
                } else {
                    point.classList.add('graph-visible');
                }
            }

            stepLabels.forEach(label => {
                label.classList.add('graph-visible');
            });

            await new Promise(resolve => setTimeout(resolve, 50));

            const stepLines = container.querySelectorAll(`.graph-line[data-step="${step}"]`);

            for (const line of stepLines) {
                const lineId = line.dataset.lineId;
                if (!animationState.linesAnimated.has(lineId)) {
                    await animateLine(line);
                    animationState.linesAnimated.add(lineId);
                } else {
                    line.style.width = `${line.dataset.fullLength}px`;
                    line.classList.add('completed');
                }
                line.classList.add('graph-visible');
            }

            animationState.currentStep = step;
            currentAnimationStates.set(containerId, animationState);


        }

        function createPointsTable(containerId, points = [], tableStep = 2, startFrom = 0) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const table = document.createElement('table');
            table.className = 'points-table';

            const filteredPoints = points.filter((point, index) =>
                index >= startFrom && (index - startFrom) % tableStep === 0
            );

            table.innerHTML = `
                <thead>
                    <tr>
                        <th>x</th>
                        <th>y</th>
                    </tr>
                </thead>
                <tbody>
                    ${filteredPoints.map(point => `
                        <tr>
                            <td>${point.x}</td>
                            <td>${point.y}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            container.appendChild(table);
        }

        function calculateLinearPoints(k, b, xRange = [-5, 5], step = 1) {
            const points = [];
            for (let x = xRange[0]; x <= xRange[1]; x += step) {
                const y = k * x + b;
                points.push({
                    x,
                    y: Math.round(y * 100) / 100
                });
            }
            return points;
        }

        // Функция для расчета точек квадратичной функции
        function calculateQuadraticPoints(a, b, c, xRange = [-5, 5], step = 1) {
            const points = [];
            for (let x = xRange[0]; x <= xRange[1]; x += step) {
                const y = a * x * x + b * x + c;
                points.push({
                    x,
                    y: Math.round(y * 100) / 100
                });
            }
            return points;
        }

        function createLinesFromPoints(points, colorClass = 'graph-color-1') {
            const lines = [];

            if (points.length < 2) return lines;

            // Добавляем прозрачные точки на концах и создаем линии между ними
            const extendedPoints = [
                // Прозрачная точка слева
                {
                    x: points[0].x - 2,
                    y: points[0].y - 2 * ((points[1].y - points[0].y) / (points[1].x - points[0].x)),
                    transparent: true
                },
                // Основные точки
                ...points,
                // Прозрачная точка справа
                {
                    x: points[points.length - 1].x + 2,
                    y: points[points.length - 1].y + 2 * ((points[points.length - 1].y - points[points.length - 2].y) / (points[points.length - 1].x - points[points.length - 2].x)),
                    transparent: true
                }
            ];

            // Создаем линии между всеми точками (включая прозрачные)
            for (let i = 0; i < extendedPoints.length - 1; i++) {
                lines.push({
                    x1: extendedPoints[i].x,
                    y1: extendedPoints[i].y,
                    x2: extendedPoints[i + 1].x,
                    y2: extendedPoints[i + 1].y,
                    colorClass: colorClass
                });
            }

            return lines;
        }

        // Функция для получения формулы по коэффициентам
        function getFormula(k, b) {
            if (k === 1 && b === 0) return 'y = x';
            if (k === -1 && b === 0) return 'y = -x';
            if (k === 1) return `y = x ${b > 0 ? '+' : ''}${b}`;
            if (k === -1) return `y = -x ${b > 0 ? '+' : ''}${b}`;
            if (b === 0) return `y = ${k}x`;
            return `y = ${k}x ${b > 0 ? '+' : ''}${b}`;
        }




        function createVerticalSlideGroup(slidesData) {
            const groupId = 'group-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);

            const mainSection = document.createElement('section');

            slidesData.forEach((slideData, index) => {
                let points, lines;

                if (slideData.a !== undefined) {
                    points = calculateQuadraticPoints(slideData.a, slideData.b, slideData.c, slideData.range, slideData.step);
                } else {
                    points = calculateLinearPoints(slideData.k, slideData.b, slideData.range, slideData.step);
                }

                lines = createLinesFromPoints(points, slideData.colorClass);

                const additionalGraphs = [];
                let stepCounter = 1;

                if (slideData.additionalGraphs) {
                    slideData.additionalGraphs.forEach(graphConfig => {
                        let graphPoints;

                        const graphRange = graphConfig.range || slideData.range;
                        const graphStep = graphConfig.step || slideData.step;

                        if (graphConfig.a !== undefined) {
                            graphPoints = calculateQuadraticPoints(graphConfig.a, graphConfig.b, graphConfig.c, graphRange, graphStep);
                        } else {
                            graphPoints = calculateLinearPoints(graphConfig.k, graphConfig.b, graphRange, graphStep);
                        }

                        const graphLines = createLinesFromPoints(graphPoints, graphConfig.colorClass);
                        additionalGraphs.push({
                            points: graphPoints.map(p => ({...p, colorClass: graphConfig.colorClass})),
                            lines: graphLines,
                            label: graphConfig.label || (graphConfig.a !== undefined ?
                                getQuadraticFormula(graphConfig.a, graphConfig.b, graphConfig.c) :
                                getFormula(graphConfig.k, graphConfig.b)),
                            step: stepCounter++
                        });
                    });
                }

                const verticalSection = document.createElement('section');
                verticalSection.setAttribute('data-animation-steps', additionalGraphs.length + 1);

                const isQuadratic = slideData.a !== undefined;
                const tableStyle = isQuadratic ? 'style="display: none;"' : '';

                verticalSection.innerHTML = `
                    <div class="two-column-slide">
                        <div class="left-column">
                            <div class="function-display">
                                <div class="function-formula">$$ ${slideData.formula} $$</div>
                            </div>
                            <div class="animation-progress" id="progress-${groupId}-${index}"></div>
                            <div class="points-table-container" ${tableStyle}>
                                <div class="table-title">Таблица значений</div>
                                <div id="table-${groupId}-${index}"></div>
                            </div>
                        </div>
                        <div class="right-column">
                            <div id="graph-${groupId}-${index}"></div>
                        </div>
                    </div>
                `;

                mainSection.appendChild(verticalSection);

                setTimeout(() => {
                    createCoordinatePlane(`graph-${groupId}-${index}`,
                        points.map(p => ({...p, colorClass: slideData.colorClass})),
                        lines,
                        additionalGraphs
                    );

                    if (!isQuadratic) {
                        createPointsTable(`table-${groupId}-${index}`, points, slideData.tableStep || 2, slideData.startFrom || 0);
                    }

                    createProgressIndicator(`progress-${groupId}-${index}`, additionalGraphs.length + 1);
                }, 100);
            });

            document.querySelector('.slides').appendChild(mainSection);
            return groupId;
        }

        // Функция для получения формулы квадратичной функции
        function getQuadraticFormula(a, b, c) {
            let formula = 'y = ';

            if (a === 1) formula += 'x²';
            else if (a === -1) formula += '-x²';
            else formula += `${a}x²`;

            if (b > 0) formula += ` + ${b === 1 ? '' : b}x`;
            else if (b < 0) formula += ` - ${b === -1 ? '' : -b}x`;

            if (c > 0) formula += ` + ${c}`;
            else if (c < 0) formula += ` - ${-c}`;

            return formula;
        }

        createAllSlides();

        Reveal.initialize({
            hash: true,
            transition: 'slide',
            plugins: [ RevealMath.MathJax3 ],
            mathjax3: {
                mathjax: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js',
                tex: {
                    inlineMath: [ ['$','$'], ['\\(','\\)'] ],
                    displayMath: [ ['$$','$$'], ['\\[','\\]'] ]
                }
            },
            keyboard: {
                32: null // Отключаем пробел по умолчанию
            }
        });

        // Кастомный обработчик пробела
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                event.stopPropagation();

                const activeSlide = Reveal.getCurrentSlide();
                if (activeSlide) {
                    const graphContainer = activeSlide.querySelector('[id^="graph-"]');
                    if (graphContainer) {
                        const containerId = graphContainer.id;
                        const animationState = currentAnimationStates.get(containerId);

                        if (animationState) {
                            const currentStep = animationState.currentStep;
                            const maxSteps = animationState.totalSteps;

                            if (currentStep < maxSteps) {
                                showAnimationStep(containerId, currentStep + 1);
                            } else {
                                Reveal.next();
                            }
                        }
                    }
                }
            }
        }, true); // Используем capture phase чтобы перехватить до Reveal.js

        // Сбрасываем анимацию при смене слайда
        Reveal.addEventListener('slidechanged', function(event) {
            const newSlide = event.currentSlide;
            const graphContainers = newSlide.querySelectorAll('[id^="graph-"]');

            graphContainers.forEach(container => {
                const containerId = container.id;
                const animationState = currentAnimationStates.get(containerId);
                if (animationState) {
                    animationState.pointsAnimated.clear();
                    animationState.linesAnimated.clear();
                    animationState.currentStep = 0;

                    const points = container.querySelectorAll('.graph-point');
                    const lines = container.querySelectorAll('.graph-line');
                    const labels = container.querySelectorAll('.graph-label');

                    points.forEach(point => point.classList.remove('graph-visible'));
                    lines.forEach(line => {
                        line.style.width = '0px';
                        line.classList.remove('graph-visible', 'completed', 'animating');
                    });
                    labels.forEach(label => label.classList.remove('graph-visible'));

                }
            });
        });
    </script>
